name: Java CI avec Gradle

# Le robot se déclenche à chaque push ou pull-request sur n'importe quelle branche
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    # On demande au robot d'utiliser un ordinateur virtuel sous Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Le robot télécharge le code de ton dépôt GitHub
      - name: Récupérer le code source
        uses: actions/checkout@v4

      # Étape 2 : Le robot installe Java (version 17)
      - name: Configurer Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # Étape 3 : Le robot donne la permission d'exécuter le script Gradle
      - name: Rendre le wrapper Gradle exécutable
        run: chmod +x gradlew

      # Étape 4 : Le robot lance le build et les tests
      - name: Build et Tests avec Gradle
        run: ./gradlew build
