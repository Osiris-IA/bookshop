# Profil DEV avec H2 - Temporaire en attendant PostgreSQL
# Utilise H2 en mémoire avec la console accessible
spring.datasource.url=jdbc:h2:mem:devdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console - pour voir les données en temps réel
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Application
server.port=8081
